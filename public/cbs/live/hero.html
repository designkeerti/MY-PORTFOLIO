      const segments = 3 + Math.floor(Math.random() * 4);
      for (let s = 1; s <= segments; s++) {
        const segLen = (len / segments) * (0.7 + Math.random() * 0.6);
        const jitter = (Math.random() - 0.5) * 0.5;
        const angle = a + jitter;
        cur = {
          x: cur.x + Math.cos(angle) * segLen,
          y: cur.y + Math.sin(angle) * segLen
        };
        pathD += ` L ${cur.x.toFixed(1)} ${cur.y.toFixed(1)}`;
      }
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', pathD);
      path.setAttribute('class', 'crack');
      path.style.opacity = (0.25 + Math.random() * 0.45).toFixed(2);
      cracks.appendChild(path);
    }

    // Debris particles inside the hole (small floating dots in the light)
    const debrisG = document.getElementById('debrisGroup');
    const N = 32;
    for (let i = 0; i < N; i++) {
      // place inside the hole-ish area
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * (baseR * 0.85);
      const x = cx + Math.cos(angle) * dist;
      const y = cy + Math.sin(angle) * dist;
      const r = 0.6 + Math.random() * 2.0;
      const op = 0.12 + Math.random() * 0.42;
      const dur = 5 + Math.random() * 10;
      const delay = -Math.random() * dur;
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', x.toFixed(1));
      c.setAttribute('cy', y.toFixed(1));
      c.setAttribute('r', r.toFixed(2));
      c.setAttribute('class', 'debris');
      c.setAttribute('opacity', op.toFixed(2));
      c.style.animation = `wallDebris ${dur}s linear ${delay}s infinite`;
      debrisG.appendChild(c);
    }
    // inject debris animation keyframes
    const style = document.createElement('style');
    style.textContent = `
      @keyframes wallDebris {
        0%   { transform: translate(0,0); opacity: 0; }
        15%  { opacity: var(--op, 1); }
        85%  { opacity: var(--op, 1); }
        100% { transform: translate(${(Math.random()-0.5)*12}px, -34px); opacity: 0; }
      }
    `;
    document.head.appendChild(style);
  }

</script><script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script><script src="/cbs/live/assets/js/theme.js"></script><script>
(function(){var q=new URLSearchParams(location.search);
 // ?state=N jumps the hero to a brand; ?still=1 stops the auto-cycle (the store pauses it on hover, so we send that event)
 window.addEventListener('load',function(){setTimeout(function(){var n=parseInt(q.get('state')||'0',10);
   if(n&&typeof snapTo==='function'){snapTo(n);}else{for(var i=0;i<n;i++)window.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight'}));}
   if(q.get('still')==='1'){var h=document.getElementById('hero');if(h)h.dispatchEvent(new Event('mouseenter'));}},1300);});
 // ?wave=1 runs the stamp reveal through the sheet two at a time, using the store's own hover rules
 if(q.get('wave')==='1'){var i=0;function step(){var chips=document.querySelectorAll('.cbs-brand-chip');if(!chips.length)return;chips.forEach(function(c){c.classList.remove('is-lit')});chips[i%chips.length].classList.add('is-lit');chips[(i+1)%chips.length].classList.add('is-lit');i++;}
   setTimeout(step,500);setInterval(step,1500);}
 if(q.get('lit')){q.get('lit').split(',').forEach(function(n){var c=document.querySelectorAll('.cbs-brand-chip')[+n];if(c)c.classList.add('is-lit');});}
 // ?n=K keeps only the first K stack tiles
 if(q.get('n')){document.querySelectorAll('.cbs-stack-tile').forEach(function(t,k){if(k>=+q.get('n'))t.remove();});}
 // ?oos=1 flips the cards to the sold-out state
 if(q.get('oos')==='1'){document.querySelectorAll('.cbs-card').forEach(function(c){c.classList.add('is-oos');});}
})();
